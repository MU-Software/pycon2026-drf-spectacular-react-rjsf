[project]
name = "schema-driven-admin-demo"
version = "0.1.0"
description = "PyCon KR demo: drf-spectacular OpenAPI to react-jsonschema-form"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<6.1",
  "django-cors-headers>=4.7",
  "djangorestframework>=3.16",
  "drf-spectacular>=0.28",
  "py-openapi-schema-to-json-schema>=0.0.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.11",
]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E501"]
ignore = ["EXE001", "RUF012"]
